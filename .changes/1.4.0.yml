version: 1.4.0
pr_number: 65
new_features:
- description: Raises the minimum supported dbt version from v1.3.0 to v1.10.0.
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10.0, the new minimum supported version.
- title: Corrected documentation for the search query performance report
  description: Removes the `ad_distribution` column from the documentation for the
    [stg_microsoft_ads__search_daily_report](https://fivetran.github.io/dbt_microsoft_ads/#!/model/model.microsoft_ads.stg_microsoft_ads__search_daily_report)
    model and the `search_query_performance_daily_report` source. Microsoft Advertising
    does not return this field in the search query performance report, so the model
    never produced it. This also removes the related warning from your dbt runs.
